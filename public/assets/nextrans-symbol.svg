  <rect x="38" y="34" width="7" height="12" rx="1" fill="#1264E9"/>
  <!-- Wheels -->
  <circle cx="20" cy="48" r="4.5" fill="#10233C" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="44" cy="48" r="4.5" fill="#10233C" stroke="#FFFFFF" stroke-width="2"/>
  <!-- IoT Connected Pulse Beacon -->
